# Pulls the formula attached to the latest lispberry/proven release into Formula/proven.rb.
# Runs hourly, on demand, and when lispberry/proven's release workflow dispatches it.
name: update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo lispberry/proven --pattern proven.rb --dir Formula --clobber || {
            echo "::notice::lispberry/proven has no release with a formula yet"
            exit 0
          }
          if [ -z "$(git status --porcelain -- Formula)" ]; then
            echo "Formula is up to date"
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/proven.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/proven.rb
          git commit -m "proven $version"
          git push
